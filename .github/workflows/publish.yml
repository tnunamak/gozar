name: Publish

# Publishes to npm when a version tag is pushed. Authentication is npm trusted
# publishing (OIDC): there is no NPM_TOKEN secret. The trusted publisher must be
# configured once on npmjs.com for this workflow file (publish.yml).
#
# A pull request that edits this file runs the checks and tests but does not
# publish: the tag check and publish steps run only for tag pushes.
on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/publish.yml

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11 typescript@7.0.2
      - run: npm --version
      - run: tsc --version
      - name: Tag must equal v + package.json version
        if: github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version ($expected)." >&2
            exit 1
          fi
      - run: npm ci
      # The compiled WASM core is not in git; the package archive must include it.
      - name: Install wasm-bindgen 0.2.105 and the WASM target
        run: |
          rustup target add wasm32-unknown-unknown
          dir="$RUNNER_TEMP/wasm-bindgen"
          mkdir -p "$dir"
          url=https://github.com/wasm-bindgen/wasm-bindgen/releases/download/0.2.105/wasm-bindgen-0.2.105-x86_64-unknown-linux-musl.tar.gz
          curl -sSfL "$url" -o "$dir/wb.tar.gz"
          echo "b391448c4926ac4b11425a6752484d85164e72489d97804461d5e868c643b88a  $dir/wb.tar.gz" | sha256sum -c -
          tar -xzf "$dir/wb.tar.gz" -C "$dir" --strip-components=1
          echo "$dir" >> "$GITHUB_PATH"
      - run: bash scripts/build-wasm.sh
      # Some tests require a private (mode 0700) ~/.tmp, as on a developer machine.
      - run: mkdir -p ~/.tmp && chmod 700 ~/.tmp
      - run: npm run test:node
      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --provenance --access public
