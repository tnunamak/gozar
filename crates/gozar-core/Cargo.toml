[package]
name = "gozar-core"
version = "0.2.0"
license.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.105"
regex = { version = "1", default-features = false, features = ["std"] }
